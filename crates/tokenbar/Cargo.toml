[package]
name = "tokenbar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Menu-bar tray for Cursor, Claude, and OpenAI usage"
publish = false
build = "build.rs"

[[bin]]
name = "tokenbar"
path = "src/main.rs"

# cargo-bundle selects the icon by extension. Paths are relative to this crate.
[package.metadata.bundle]
name = "TokenBar"
identifier = "app.tokenbar.TokenBar"
icon = [
  "../../assets/AppIcon.icns",
  "../../assets/tokenbar.ico",
  "../../assets/tokenbar.png",
]

# cargo-wix MSI product icon. The exe icon is embedded by build.rs (winres).
[package.metadata.wix]
product-icon = "../../assets/tokenbar.ico"

[dependencies]
gpui-kit = { version = "=0.6.6", default-features = false }
gpui-tray = { version = "=0.3.0", default-features = false, features = ["gpui-kit"] }
tokenbar-core = { path = "../tokenbar-core" }

[target.'cfg(target_os = "macos")'.dependencies]
async-channel = "2"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSObject", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSRunningApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSScreen", "NSView", "NSWindow", "block2"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
