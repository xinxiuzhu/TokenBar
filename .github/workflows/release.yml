name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: tokenbar-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: tokenbar-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: tokenbar-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: tokenbar-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat packaging/linux/apt.txt)
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}" ./packaging/macos/package.sh
          staged="dist/tokenbar-${{ matrix.target }}"
          cp LICENSE NOTICE README.md "${staged}/"
          tokenbar_offline="${staged}/tokenbar"
          output="$(TOKENBAR_OFFLINE=1 "${tokenbar_offline}" --check)"
          printf '%s\n' "${output}"
          python3 -c 'import json,sys; data=json.loads(sys.argv[1]); assert data["title"]=="R42% C72% O1.2k", data' "${output}"
          tar -C dist -czf "${{ matrix.asset }}" "tokenbar-${{ matrix.target }}"

      - name: Linux binary
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo test -p tokenbar-core
          cargo build -p tokenbar --release --target "${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/tokenbar"
          output="$(TOKENBAR_OFFLINE=1 "${bin}" --check)"
          printf '%s\n' "${output}"
          python3 -c 'import json,sys; data=json.loads(sys.argv[1]); assert data["title"]=="R42% C72% O1.2k", data; assert data["offline"] is True' "${output}"
          stage="dist/tokenbar-${{ matrix.target }}"
          mkdir -p "${stage}"
          cp "${bin}" LICENSE NOTICE README.md "${stage}/"
          tar -C dist -czf "${{ matrix.asset }}" "tokenbar-${{ matrix.target }}"

      - name: Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test -p tokenbar-core
          cargo build -p tokenbar --release --target ${{ matrix.target }}
          $bin = "target/${{ matrix.target }}/release/tokenbar.exe"
          $env:TOKENBAR_OFFLINE = "1"
          $output = & $bin --check | Out-String
          Write-Host $output
          if ($output -notmatch 'R42% C72% O1\.2k') { throw "offline check failed: $output" }
          $stage = "dist/tokenbar-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $bin, LICENSE, NOTICE, README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -l release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          make_latest: ${{ github.event_name == 'push' }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            TokenBar desktop builds for Apple Silicon, Intel Mac (`x86_64-apple-darwin`, cross-compiled on macos-latest because the Intel macos-13 runner is retired), Linux, and Windows.

            Assets:

            - `tokenbar-aarch64-apple-darwin.tar.gz` — `TokenBar.app` (`LSUIElement`)
            - `tokenbar-x86_64-apple-darwin.tar.gz` — Intel Mac app and binary
            - `tokenbar-x86_64-unknown-linux-gnu.tar.gz`
            - `tokenbar-x86_64-pc-windows-msvc.zip`

            `TOKENBAR_OFFLINE=1 tokenbar --check` prints a snapshot whose `title` is `R42% C72% O1.2k`.
            Each archive includes `LICENSE`, `NOTICE`, and `README.md`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
